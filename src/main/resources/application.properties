spring.application.name=UTETra

# Nap them application-local.properties (khong commit) de de mat khau rieng tung may
spring.config.import=optional:classpath:application-local.properties

# ===== CSDL: mac dinh SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=utetra;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# username/password dat trong application-local.properties

# Neu dung MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/utetra?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Neu dung PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/utetra
# spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Du lieu mau =====
# Bat lan dau chay de tao san tai khoan + san pham mau. Xong roi doi thanh false.
app.seed.enabled=true

# ===== JWT =====
# secret PHAI la Base64. Sinh moi: openssl rand -base64 64
app.jwt.secret=Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZW1vLXNlY3JldC1rZXktcGxlYXNlLXJlcGxhY2UtaXQ=
app.jwt.expiration-ms=86400000

# ===== Email OTP =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# username/password (App Password cua Gmail) dat trong application-local.properties
app.otp.expire-minutes=5

# ===== Cloudinary =====
# Dat cloudinary.cloud-name / api-key / api-secret trong application-local.properties.
# De trong o day la co y: chua cau hinh thi bean Cloudinary khong duoc tao,
# app van chay binh thuong, chi la chua upload duoc anh.

# ===== Server =====
server.port=8080
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
