<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Quản lý người dùng</title>
</head>
<body>

<div layout:fragment="content">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h1 class="h4 mb-1">Quản lý người dùng</h1>
            <p class="text-muted mb-0 small">Tìm kiếm, khoá/mở khoá và đổi vai trò tài khoản.</p>
        </div>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin}">Về bảng điều khiển</a>
    </div>

    <div class="alert alert-success py-2" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger py-2" th:if="${errorMessage}" th:text="${errorMessage}"></div>


    <form class="row g-2 mb-3" method="get" th:action="@{/admin/users}">
        <div class="col-md-5">
            <input class="form-control form-control-sm" name="keyword" th:value="${keyword}"
                   placeholder="Tìm theo tên đăng nhập, họ tên hoặc email"/>
        </div>
        <div class="col-md-3">
            <select class="form-select form-select-sm" name="role">
                <option value="">— tất cả vai trò —</option>
                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"
                        th:selected="${role != null and role.name() == r.name()}">vai</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-sm btn-primary w-100" type="submit">Tìm</button>
        </div>
        <div class="col-md-2">
            <a class="btn btn-sm btn-outline-secondary w-100" th:href="@{/admin/users}">Xoá lọc</a>
        </div>
    </form>

    <p class="text-muted small" th:if="${page.isEmpty()}">Không tìm thấy tài khoản nào.</p>

    <div class="table-responsive" th:unless="${page.isEmpty()}">
        <table class="table table-sm align-middle">
            <thead>
            <tr>
                <th style="width:3rem">#</th>
                <th>Tài khoản</th>
                <th>Liên hệ</th>
                <th>Trạng thái</th>
                <th style="width:16rem">Vai trò</th>
                <th style="width:8rem">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${page.content}">
                <td th:text="${u.id}">1</td>
                <td>
                    <div class="fw-medium" th:text="${u.username}">tên</div>
                    <small class="text-muted" th:text="${u.fullName}">họ tên</small>
                </td>
                <td>
                    <small class="d-block" th:text="${u.email}">email</small>
                    <small class="text-muted" th:text="${u.phone}">sđt</small>
                </td>
                <td>
                    <span class="badge text-bg-success" th:if="${u.enabled and !u.locked}">Hoạt động</span>
                    <span class="badge text-bg-warning" th:if="${!u.enabled}">Chưa kích hoạt</span>
                    <span class="badge text-bg-danger" th:if="${u.locked}">Đã khoá</span>
                </td>
                <td>
                    <form class="d-flex gap-1" method="post" th:action="@{'/admin/users/' + ${u.id} + '/role'}">
                        <select class="form-select form-select-sm" name="role">
                            <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.label}"
                                    th:selected="${u.role.name() == r.name()}">vai</option>
                        </select>
                        <button class="btn btn-sm btn-outline-secondary" type="submit">Lưu</button>
                    </form>
                </td>
                <td>
                    <form method="post" th:action="@{'/admin/users/' + ${u.id} + '/lock'}">
                        <button class="btn btn-sm"
                                th:classappend="${u.locked} ? 'btn-outline-success' : 'btn-outline-danger'"
                                th:text="${u.locked} ? 'Mở khoá' : 'Khoá'" type="submit">Khoá</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/pagination :: pager(${page}, '/admin/users')}"></div>


</div>

</body>
</html>
