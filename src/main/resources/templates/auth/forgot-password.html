<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h5 mb-3">Quên mật khẩu</h1>

                    <div class="alert alert-success py-2" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${formError}" th:text="${formError}"></div>

                    <p class="text-muted small">
                        Nhập email đã đăng ký. Nếu email có trong hệ thống, chúng tôi sẽ gửi mã OTP để bạn đặt lại mật khẩu.
                    </p>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email" required autofocus/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Gửi mã OTP</button>
                    </form>

                    <div class="text-center mt-3 small">
                        <a th:href="@{/login}">Quay lại đăng nhập</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
