<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Đăng nhập</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h5 mb-3">Đăng nhập</h1>

                    <div class="alert alert-success py-2" th:if="${successMessage}"
                         th:text="${successMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${param.error}">
                        Sai tên đăng nhập hoặc mật khẩu. Nếu bạn vừa đăng ký, hãy
                        <a th:href="@{/verify-otp}">kích hoạt tài khoản</a> trước.
                    </div>
                    <div class="alert alert-success py-2" th:if="${param.logout}">
                        Đã đăng xuất.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Tên đăng nhập hoặc email</label>
                            <input class="form-control" id="username" name="username" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <input class="form-control" id="password" name="password" type="password" required/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    </form>

                    <div class="d-flex justify-content-between mt-3 small">
                        <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                        <a th:href="@{/register}">Tạo tài khoản</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
