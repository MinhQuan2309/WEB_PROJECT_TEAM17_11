<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h5 mb-3">Đặt lại mật khẩu</h1>

                    <div class="alert alert-success py-2" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${formError}" th:text="${formError}"></div>

                    <div class="alert alert-warning py-2 small" th:unless="${mailConfigured}">
                        Hệ thống chưa cấu hình Gmail nên không gửi email thật.
                        Mã OTP được in ra màn hình Console của ứng dụng — tìm dòng
                        <code>MA OTP</code> trong cửa sổ chạy app.
                    </div>

                    <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" type="email" th:field="*{email}" required/>
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="code">Mã OTP</label>
                            <input class="form-control text-center" id="code" th:field="*{code}"
                                   inputmode="numeric" maxlength="6" placeholder="000000" required/>
                            <div class="form-text">
                                Mã có hiệu lực <span th:text="${expireMinutes}">5</span> phút.
                            </div>
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('code')}"
                                 th:errors="*{code}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu mới *</label>
                            <input class="form-control" id="password" type="password" th:field="*{password}" required/>
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới *</label>
                            <input class="form-control" id="confirmPassword" type="password"
                                   th:field="*{confirmPassword}" required/>
                            <div class="form-text text-danger" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đổi mật khẩu</button>
                    </form>

                    <div class="text-center mt-3 small">
                        Chưa nhận được mã? <a th:href="@{/forgot-password}">Gửi lại</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
