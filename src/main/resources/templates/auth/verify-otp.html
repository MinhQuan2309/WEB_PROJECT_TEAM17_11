<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Kích hoạt tài khoản</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h5 mb-3">Nhập mã OTP</h1>

                    <div class="alert alert-success py-2" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-danger py-2" th:if="${formError}" th:text="${formError}"></div>

                    <div class="alert alert-warning py-2 small" th:unless="${mailConfigured}">
                        Hệ thống chưa cấu hình Gmail nên không gửi email thật.
                        Mã OTP được in ra màn hình Console của ứng dụng — tìm dòng
                        <code>MA OTP</code> trong cửa sổ chạy app.
                    </div>

                    <p class="text-muted small">
                        Mã gồm 6 chữ số, có hiệu lực
                        <span th:text="${expireMinutes}">5</span> phút.
                    </p>

                    <form th:action="@{/verify-otp}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email đã đăng ký</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   th:value="${email}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="code">Mã OTP</label>
                            <input class="form-control form-control-lg text-center" id="code" name="code"
                                   inputmode="numeric" maxlength="6" placeholder="000000" required autofocus/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Kích hoạt tài khoản</button>
                    </form>

                    <form th:action="@{/verify-otp/resend}" method="post" class="mt-2">
                        <input type="hidden" name="email" th:value="${email}"/>
                        <button class="btn btn-link w-100 p-0 small" type="submit">Gửi lại mã OTP</button>
                    </form>

                    <div class="text-center mt-3 small">
                        <a th:href="@{/login}">Quay lại đăng nhập</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
