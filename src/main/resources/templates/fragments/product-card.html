<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>

<!-- Thẻ sản phẩm dùng chung cho trang chủ, trang danh mục, trang shop.
     Cách gọi:  <div th:replace="~{fragments/product-card :: card(${p})}"></div> -->
<div th:fragment="card(product)" class="card h-100 product-card">
    <img class="card-img-top product-thumb"
         th:src="${product.imageUrl != null} ? ${product.imageUrl} : 'https://placehold.co/400x300?text=UTETra'"
         th:alt="${product.name}"/>
    <div class="card-body d-flex flex-column">
        <h6 class="card-title mb-1" th:text="${product.name}">Tên sản phẩm</h6>
        <div class="small text-muted mb-2" th:text="${product.shop != null} ? ${product.shop.name} : ''">Shop</div>
        <div class="mt-auto d-flex justify-content-between align-items-center">
            <span class="fw-bold text-danger"
                  th:text="${#numbers.formatInteger(product.basePrice, 0, 'POINT')} + ' đ'">0 đ</span>
            <small class="text-muted">
                <i class="bi bi-star-fill text-warning"></i>
                <span th:text="${product.ratingAvg}">0</span>
                &middot;
                <span th:text="'Đã bán ' + ${product.soldCount}">Đã bán 0</span>
            </small>
        </div>
    </div>
    <a class="stretched-link" th:href="@{'/products/' + ${product.id}}" th:aria-label="${product.name}"></a>
</div>

</body>
</html>
