<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE - UTETra">UTETra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <th:block layout:fragment="styles"></th:block>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Layout gốc - đây là Decorator pattern: mọi trang con được "bọc" bởi khung này.
     Trang con chỉ cần khai báo layout:decorate="~{layout/base}" rồi điền vào fragment content. -->

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1" layout:fragment="content">
    <p>Nội dung mặc định.</p>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
