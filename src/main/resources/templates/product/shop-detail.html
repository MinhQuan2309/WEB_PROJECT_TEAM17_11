<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title th:text="${shop.name}">Cửa hàng</title>
    <th:block layout:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/hai-storefront.css}"/>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <span class="badge bg-success mb-2">Đang hoạt động</span>
                <h1 class="h4 fw-bold mb-1" th:text="${shop.name}">Tên Shop</h1>
                <p class="text-muted mb-1" th:text="${shop.description}">Mô tả</p>
                <div class="small text-secondary">
                    <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                    <span th:text="${shop.address}">Địa chỉ</span>
                    <span class="mx-2">|</span>
                    <i class="bi bi-telephone-fill text-primary me-1"></i>
                    <span th:text="${shop.phone}">SĐT</span>
                </div>
            </div>
            <form th:action="@{/shop/{id}(id=${shop.id})}" method="get" class="d-flex gap-2">
                <input type="search" name="keyword" class="form-control form-control-sm"
                       th:value="${filter.keyword()}" placeholder="Tìm món trong shop..."/>
                <button type="submit" class="btn btn-sm btn-primary text-nowrap">Tìm</button>
            </form>
        </div>
    </div>

    <!-- Voucher của shop nếu có -->
    <div class="mb-4" th:if="${vouchers != null and !vouchers.isEmpty()}">
        <h2 class="h6 fw-bold text-uppercase text-muted mb-2">Mã giảm giá của Shop</h2>
        <div class="d-flex flex-wrap gap-2">
            <div class="border rounded-3 px-3 py-2 bg-white shadow-sm" th:each="v : ${vouchers}">
                <span class="badge bg-danger me-1" th:text="${v.code}">CODE</span>
                <small th:text="${v.discountType.label} + ' - Đơn tối thiểu ' + ${#numbers.formatInteger(v.minOrderTotal, 0, 'POINT')} + ' đ'"></small>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 fw-bold mb-0 section-header-bar">Thực đơn của <span th:text="${shop.name}">Shop</span></h2>
        <small class="text-muted" th:text="${page.totalElements} + ' sản phẩm'">0 sản phẩm</small>
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-3" th:if="${!page.isEmpty()}">
        <div class="col" th:each="p : ${page.content}">
            <div th:replace="~{fragments/product-card :: card(${p})}"></div>
        </div>
    </div>

    <div class="mt-4" th:replace="~{fragments/pagination :: pager(${page}, '/shop/' + ${shop.id})}"></div>
</div>

</body>
</html>
