<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title th:text="${shop.name}">Shop</title>
</head>
<body>

<div layout:fragment="content">

    <div class="card mb-4 overflow-hidden">
        <img th:if="${shop.bannerUrl != null}" th:src="${shop.bannerUrl}" alt="Banner shop"
             class="w-100" style="max-height:220px;object-fit:cover"/>
        <div class="card-body">
            <div class="d-flex align-items-start gap-3">
                <img th:if="${shop.logoUrl != null}" th:src="${shop.logoUrl}" alt="Logo shop"
                     class="rounded border" style="width:80px;height:80px;object-fit:cover"/>
                <div class="flex-grow-1">
                    <h1 class="h4 mb-1" th:text="${shop.name}">Tên shop</h1>
                    <p class="text-muted mb-1" th:if="${shop.description != null}"
                       th:text="${shop.description}">Mô tả</p>
                    <div class="small text-muted">
                        <i class="bi bi-geo-alt"></i> <span th:text="${shop.address}">Địa chỉ</span>
                        <span th:if="${shop.phone != null}">
                            &middot; <i class="bi bi-telephone"></i>
                            <span th:text="${shop.phone}">SĐT</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h2 class="h5 mb-3">Sản phẩm của shop</h2>
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
        <div class="col" th:each="p : ${products.content}">
            <div th:replace="~{fragments/product-card :: card(${p})}"></div>
        </div>
    </div>
    <p class="text-muted" th:if="${products.isEmpty()}">Shop chưa có sản phẩm nào đang bán.</p>

    <div class="mt-4" th:if="${toppings != null and !toppings.isEmpty()}">
        <h2 class="h6 text-uppercase text-muted mb-2">Topping của shop</h2>
        <ul class="list-inline mb-0">
            <li class="list-inline-item badge text-bg-light border" th:each="t : ${toppings}">
                <span th:text="${t.name}">Topping</span>
                <span th:text="'+' + ${#numbers.formatInteger(t.price, 0, 'POINT')} + ' đ'"></span>
            </li>
        </ul>
    </div>

</div>

</body>
</html>
