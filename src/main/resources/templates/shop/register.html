<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="vi">
<head>
    <title>Đăng ký mở shop</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h1 class="h4 mb-1">Đăng ký mở shop</h1>
            <p class="text-muted">
                Điền thông tin shop của bạn. Shop sẽ ở trạng thái <strong>chờ duyệt</strong>;
                sau khi Admin/Manager duyệt, tài khoản được nâng lên vai Người bán (VENDOR)
                và bạn vào được khu vực quản lý shop.
            </p>

            <div class="alert alert-warning" th:if="${uploadError != null}" th:text="${uploadError}"></div>

            <form th:action="@{/shop/register}" th:object="${form}" method="post"
                  enctype="multipart/form-data" class="card card-body shadow-sm">
                <div class="row g-3">

                    <div class="col-12">
                        <label class="form-label" for="name">
                            Tên shop <span class="text-danger">*</span>
                        </label>
                        <input id="name" type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               th:field="*{name}" maxlength="150"
                               placeholder="Ví dụ: UTETra Lê Văn Việt"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label" for="address">
                            Địa chỉ <span class="text-danger">*</span>
                        </label>
                        <input id="address" type="text" class="form-control"
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                               th:field="*{address}" maxlength="255"
                               placeholder="Số nhà, đường, phường, quận, thành phố"/>
                        <div class="invalid-feedback" th:errors="*{address}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input id="phone" type="tel" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               th:field="*{phone}" maxlength="20"
                               placeholder="0901234567"/>
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="description">Mô tả shop</label>
                        <textarea id="description" class="form-control" rows="4"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  th:field="*{description}" maxlength="1000"
                                  placeholder="Giới thiệu ngắn về shop, món đặc trưng, giờ mở cửa..."></textarea>
                        <div class="invalid-feedback" th:errors="*{description}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="logo">Logo shop</label>
                        <input id="logo" type="file" name="logo" class="form-control"
                               accept="image/jpeg,image/png,image/webp,image/gif"/>
                        <div class="form-text">JPEG, PNG, WEBP hoặc GIF, tối đa 5MB.</div>
                    </div>

                </div>

                <hr class="my-4"/>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Gửi đăng ký
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/}">Về trang chủ</a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
